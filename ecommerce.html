<!DOCTYPE html>
<html>
<head>
    <title>E-Commerce Website</title>
</head>

<body>

    <!-- Header -->
    <header style="background-color: navy; color: white; padding: 15px;">
        <h1 align="center">E-Commerce Store</h1>
    </header>

    <hr>

    <!-- Navigation -->
    <nav align="center">
        <a href="#">Home</a> |
        <a href="#">Products</a> |
        <a href="#">About</a> |
        <a href="#">Contact</a>
    </nav>

    <hr>

    <!-- Main Section -->
    <main>

        <h2>About Products</h2>

        <p>
            Welcome to our E-Commerce Store. We provide quality electronic
            products at affordable prices.
        </p>

        <!-- Product Figures -->

        <figure>
            <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=300"
                 alt="Laptop" width="200" height="150">
            <figcaption>Laptop - ₹55,000</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=300"
                 alt="Smartphone" width="200" height="150">
            <figcaption>Smartphone - ₹20,000</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300"
                 alt="Headphones" width="200" height="150">
            <figcaption>Headphones - ₹2,500</figcaption>
        </figure>

        <h2>Product List</h2>

        <table border="1" cellpadding="10">
            <tr>
                <th>Product Name</th>
                <th>Price</th>
            </tr>

            <tr>
                <td>Laptop</td>
                <td>₹55,000</td>
            </tr>

            <tr>
                <td>Smartphone</td>
                <td>₹20,000</td>
            </tr>

            <tr>
                <td>Headphones</td>
                <td>₹2,500</td>
            </tr>
        </table>

    </main>

    <hr>

    <!-- Footer -->
    <footer align="center">
        <p>&copy; 2026 E-Commerce Store. All Rights Reserved.</p>
    </footer>

</body>
</html>
